name: Deploy kepstroy.ru

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run pre-deploy validation
        run: python scripts/validate.py

  build-site:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push site image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-forms:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-forms
          tags: |
            type=raw,value=latest

      - name: Build and push forms image
        uses: docker/build-push-action@v5
        with:
          context: ./form-handler
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: [build-site, build-forms]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PROXY_URL: ${{ secrets.TELEGRAM_PROXY_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          envs: BOT_TOKEN,CHAT_ID,TELEGRAM_PROXY_URL
          script: |
            set -euxo pipefail
            cd /opt/kepstroy-site || mkdir -p /opt/kepstroy-site
            cd /opt/kepstroy-site

            # Pull latest compose file from repo (raw.githubusercontent.com is unreliable from server)
            rm -rf /tmp/kepstroy-repo
            git clone --depth 1 --branch main --single-branch https://github.com/vlasdobry/kepstroy-site.git /tmp/kepstroy-repo
            cp /tmp/kepstroy-repo/docker-compose.yml /opt/kepstroy-site/docker-compose.yml
            rm -rf /tmp/kepstroy-repo

            # Write environment variables for docker compose
            cat > .env <<EOF
            BOT_TOKEN=${BOT_TOKEN}
            CHAT_ID=${CHAT_ID}
            TELEGRAM_PROXY_URL=${TELEGRAM_PROXY_URL}
            EOF

            sudo docker compose pull
            sudo -E docker compose --env-file .env up -d --force-recreate
            sleep 5
            echo "Removing Telegram webhook (using polling instead)..."
            curl -s --max-time 15 -x "$TELEGRAM_PROXY_URL" "https://api.telegram.org/bot${BOT_TOKEN}/deleteWebhook" || echo "deleteWebhook failed"
            sudo docker compose logs --tail=20
            echo "Testing form handler health..."
            HTTP_CODE=$(curl -s --max-time 20 -o /dev/null -w "%{http_code}" "http://localhost:3000/health")
            echo "Form handler health HTTP code: $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ]; then
              sudo docker compose logs --tail=50
              exit 1
            fi
            sudo docker image prune -f
