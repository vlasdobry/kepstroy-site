name: Deploy kepstroy.ru

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-latest
    concurrency:
      group: kepstroy-validate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            form-handler/package-lock.json

      - name: Install frontend test dependencies
        run: npm ci

      - name: Install Chromium for accessibility tests
        run: npx playwright install --with-deps chromium

      - name: Test frontend accessibility runtime
        run: CI=true node tests/test_accessibility_runtime.cjs

      - name: Test form handler
        working-directory: form-handler
        run: |
          npm ci
          npm test
          npm audit --omit=dev

      - name: Test frontend form runtime
        run: node --test tests/test_form_runtime.cjs

      - name: Test analytics consent runtime
        run: npm run test:analytics-consent

      - name: Run site readiness tests
        run: python -m unittest discover -s tests -v

      - name: Run pre-deploy validation
        run: python scripts/validate.py

  build-site:
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: kepstroy-build-site-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}

      - name: Build and push site image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-forms:
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: kepstroy-build-forms-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-forms
          tags: |
            type=raw,value=${{ github.sha }}

      - name: Build and push forms image
        uses: docker/build-push-action@v5
        with:
          context: ./form-handler
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: [build-site, build-forms]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: kepstroy-production
      cancel-in-progress: false
    environment: production

    steps:
      - name: Check release is still current
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LATEST_SHA=$(gh api "repos/${REPOSITORY}/commits/main" --jq .sha)
          if [ "$LATEST_SHA" = "$RELEASE_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale release ${RELEASE_SHA}; main is ${LATEST_SHA}."
          fi

      - name: Checkout release revision
        if: steps.freshness.outputs.current == 'true'
        uses: actions/checkout@v4

      - name: Upload release files from this revision
        if: steps.freshness.outputs.current == 'true'
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,nginx.conf"
          target: "/tmp/kepstroy-release-${{ github.sha }}"

      - name: Deploy to server
        if: steps.freshness.outputs.current == 'true'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PROXY_URL: ${{ secrets.TELEGRAM_PROXY_URL }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          envs: BOT_TOKEN,CHAT_ID,TELEGRAM_PROXY_URL,RELEASE_SHA
          script: |
            set -euo pipefail
            if [ "${#RELEASE_SHA}" -ne 40 ] || printf '%s' "$RELEASE_SHA" | grep -q '[^0-9a-f]'; then
              echo "Invalid release SHA"
              exit 1
            fi

            RELEASE_DIR="/tmp/kepstroy-release-${RELEASE_SHA}"
            test -f "$RELEASE_DIR/docker-compose.yml"
            test -f "$RELEASE_DIR/nginx.conf"
            sudo mkdir -p /opt/kepstroy-site
            sudo install -m 0644 "$RELEASE_DIR/docker-compose.yml" /opt/kepstroy-site/docker-compose.yml
            sudo install -m 0644 "$RELEASE_DIR/nginx.conf" /opt/kepstroy-site/nginx.conf
            cd /opt/kepstroy-site

            # Write environment variables for docker compose
            cat > .env <<EOF
            BOT_TOKEN=${BOT_TOKEN}
            CHAT_ID=${CHAT_ID}
            TELEGRAM_PROXY_URL=${TELEGRAM_PROXY_URL}
            KEPSTROY_IMAGE_TAG=${RELEASE_SHA}
            EOF

            sudo docker compose --env-file .env pull
            sudo docker compose --env-file .env up -d --force-recreate
            sleep 5
            echo "Removing Telegram webhook (using polling instead)..."
            curl -s --max-time 15 -x "$TELEGRAM_PROXY_URL" "https://api.telegram.org/bot${BOT_TOKEN}/deleteWebhook" || echo "deleteWebhook failed"
            sudo docker compose logs --tail=20
            echo "Testing form handler health..."
            HTTP_CODE=$(curl -s --max-time 20 -o /dev/null -w "%{http_code}" "http://localhost:3000/health")
            echo "Form handler health HTTP code: $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ]; then
              sudo docker compose logs --tail=50
              exit 1
            fi

            EXPECTED_SITE_IMAGE=ghcr.io/vlasdobry/kepstroy-site:${RELEASE_SHA}
            EXPECTED_FORMS_IMAGE=ghcr.io/vlasdobry/kepstroy-site-forms:${RELEASE_SHA}
            if ! ACTUAL_SITE_IMAGE=$(sudo docker inspect --format '{{.Config.Image}}' kepstroy-site); then
              sudo docker compose logs --tail=50
              exit 1
            fi
            if ! ACTUAL_FORMS_IMAGE=$(sudo docker inspect --format '{{.Config.Image}}' kepstroy-forms); then
              sudo docker compose logs --tail=50
              exit 1
            fi
            if [ "$ACTUAL_SITE_IMAGE" != "$EXPECTED_SITE_IMAGE" ] || \
               [ "$ACTUAL_FORMS_IMAGE" != "$EXPECTED_FORMS_IMAGE" ]; then
              echo "Deployed image revision mismatch"
              sudo docker compose logs --tail=50
              exit 1
            fi

            echo "Testing public pages with read-only requests..."
            curl -fsS --max-time 20 -o /dev/null "https://kepstroy.ru/"
            curl -fsS --max-time 20 -o /dev/null "https://kepstroy.ru/uslugi/generatory/"

            echo "Testing Telegram API connectivity..."
            curl -fsS --max-time 20 -x "$TELEGRAM_PROXY_URL" \
              "https://api.telegram.org/bot${BOT_TOKEN}/getMe" > /dev/null

            rm -rf "$RELEASE_DIR"
            sudo docker image prune -f
